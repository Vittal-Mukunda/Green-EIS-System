# Dry-run configuration for `gauge --config config/study_dry.yaml ...` / `make all-dry`.
# 2 synthetic sectors x 3 synthetic companies, MockRunner only. Writes under dry/ (gitignored),
# never touches data/processed/ or runs/. All data here is SYNTHETIC and says nothing about real firms.

study:
  name: "DRY RUN (synthetic data, MockRunner)"
  analysis_fy: "FY2024-25"
  trend_fys: ["FY2022-23", "FY2023-24", "FY2024-25"]
  companies_per_sector: 3
  sectors:
    - {name: "Synthetic Alpha", code: "SYA"}
    - {name: "Synthetic Beta",  code: "SYB"}

runs:
  conditions: ["C1", "C2"]
  repetitions: 2
  master_seed: 42
  pause_seconds: 0
  rep2_min_gap_minutes: 0          # no waiting in a dry run
  models_file: "config/models_dry.yaml"

stats:
  bootstrap_resamples: 200         # fewer resamples keep the dry run fast
  ci_level: 0.95
  alpha: 0.05
  holm_within_family: true

paths:
  database_url: "sqlite:///dry/gauge_dry.db"
  indicators_file: "config/indicators.yaml"
  raw_data_dir: "dry/data_raw"
  rules_dir: "dry/registry/rules"
  prompts_registry_dir: "dry/registry/prompts"
  frozen_manifest: "dry/registry/frozen_manifest.json"
  runs_dir: "dry/runs"
  sandbox_dir: "dry/runs/sandbox"
  results_dir: "dry/results"
  docs_dir: "dry/docs"
