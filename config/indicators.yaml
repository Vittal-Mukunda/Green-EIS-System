# Indicator and KPI catalogue (spec §4.2). Loaded by gauge.config.load_indicators().
#
# `code`   internal identifier used in the DB and code (OUR naming, not a BRSR/XBRL element name).
# `label`  the exact name shown to models in prompts; `top_drivers` in model output must use these.
# `unit`   canonical unit after standardization (conversion factors are added in Phase 2).
# `brsr_ref` / `xbrl_element`  deliberately TODO(verify): hard rule 8 forbids guessing field names.
#          They are filled from real files in Phase 2/3 and tracked in docs/VERIFY.md.
# Ranking and classification use intensities and within-sector comparison only, never raw
# emissions (hard rule 10); `rankable: false` marks raw quantities.

indicators:
  - {code: revenue_from_operations, label: "Revenue from operations", unit: "INR_crore", group: finance,    rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: energy_total,            label: "Total energy consumption", unit: "GJ",        group: energy,     rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: energy_renewable,        label: "Renewable energy consumption", unit: "GJ",    group: renewables, rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: scope1_emissions,        label: "Scope 1 emissions",        unit: "tCO2e",     group: emissions,  rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: scope2_emissions,        label: "Scope 2 emissions",        unit: "tCO2e",     group: emissions,  rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: water_withdrawal,        label: "Water withdrawal",         unit: "kL",        group: water,      rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: water_consumption,       label: "Water consumption",        unit: "kL",        group: water,      rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: waste_generated,         label: "Waste generated",          unit: "t",         group: waste,      rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}
  - {code: waste_recovered,         label: "Waste recovered",          unit: "t",         group: waste,      rankable: false, brsr_ref: "TODO(verify)", xbrl_element: "TODO(verify)"}

# Categorical report attributes (stored on `report`, not in indicator_value).
report_attributes:
  - {code: reporting_boundary, label: "Reporting boundary", values: ["standalone", "consolidated"]}
  - {code: assurance_status,   label: "Assurance status",   values: ["assured", "not_assured"], note: "TODO(verify): BRSR may distinguish reasonable/limited assurance"}

# Derived KPIs. Computed with decimal.Decimal by the deterministic engine (Phase 2).
# `better` gives the direction used by the T2/T3 rules.
kpis:
  - code: energy_intensity
    label: "Energy intensity"
    unit: "GJ per INR crore"
    formula: "energy_total / revenue_from_operations"
    better: lower
    core: false
  - code: emissions_intensity
    label: "Emissions intensity (Scope 1+2)"
    unit: "tCO2e per INR crore"
    formula: "(scope1_emissions + scope2_emissions) / revenue_from_operations"
    better: lower
    core: true
  - code: water_intensity
    label: "Water intensity"
    unit: "kL per INR crore"
    # DECISION FOR OWNER (docs/VERIFY.md V-05): defined on water CONSUMPTION, not withdrawal.
    formula: "water_consumption / revenue_from_operations"
    better: lower
    core: true
  - code: renewable_share
    label: "Renewable energy share"
    unit: "%"
    formula: "100 * energy_renewable / energy_total"
    better: higher
    core: true
  - code: waste_recovery_rate
    label: "Waste recovery rate"
    unit: "%"
    formula: "100 * waste_recovered / waste_generated"
    better: higher
    core: false

# 2-year change for every KPI: 100 * (kpi[analysis_fy] - kpi[analysis_fy - 2y]) / kpi[analysis_fy - 2y].
# "Improved" means the change moves in the KPI's `better` direction.
change_2y:
  enabled: true

# Indicator groups used by the optional leave-one-indicator-out extension (spec §4.7).
leave_one_out_groups:
  emissions:  [scope1_emissions, scope2_emissions]
  water:      [water_withdrawal, water_consumption]
  renewables: [energy_renewable]
