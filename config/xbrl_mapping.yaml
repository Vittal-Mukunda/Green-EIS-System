# Mapping from the SEBI BRSR XBRL taxonomy to our indicators (spec §6.1; hard rule 8).
#
# Every element name below was READ from real filings on 2026-10-02: the 20 FY2025-26 BRSR XBRL files
# of the primary-five companies, all using schema `in-capmkt-ent-2026-02-28.xsd` in the namespace
# https://www.sebi.gov.in/xbrl/2026-02-28/in-capmkt. Nothing here is guessed.
#
# `schema_refs` lists the taxonomy versions this mapping has been CHECKED against. The loader refuses
# a filing that references any other version, because an element name can keep its spelling and change
# meaning between versions. To support another version, compare it with the taxonomy archive, then add
# it here (docs/VERIFY.md V-18).

schema_refs:
  - "in-capmkt-ent-2026-02-28.xsd"
  # Read 2026-10-05 from the FY2023-24 filings of Shree Cement, UltraTech and JK Cement. The nine
  # indicator elements, ReportingBoundary, the four assurance-subtype elements, Turnover and
  # TotalRevenueOfTheCompany use the same local names as 2026-02-28. This version has no ISIN fact.
  # The XSD file itself was not in the downloaded taxonomy zip (V-18).
  - "in-capmkt-ent-2024-04-30.xsd"

# Company-level facts sit in contexts that have NO dimensions and a 12-month April-March duration.
identity:
  isin: "ISIN"                    # join key to data/reference/candidate_pool.csv
  cin: "CorporateIdentityNumber"  # used when the filing has no ISIN fact (taxonomy 2024-04-30)
  name: "NameOfTheCompany"
  boundary: "ReportingBoundary"   # text, see boundary_values
  assurer_name: "NameOfTheCompanyOrLLPOrFirmOfAssessmentOrAssuranceProvider"

boundary_values:
  "Standalone basis": standalone
  "Consolidated basis": consolidated

# our indicator code -> XBRL element and measurement kind (selects the unit table)
indicators:
  revenue_from_operations: {element: "RevenueFromOperations",                              kind: currency}
  energy_total:            {element: "TotalEnergyConsumedFromRenewableAndNonRenewableSources", kind: energy}
  energy_renewable:        {element: "TotalEnergyConsumedFromRenewableSources",            kind: energy}
  scope1_emissions:        {element: "TotalScope1Emissions",                               kind: emissions}
  scope2_emissions:        {element: "TotalScope2Emissions",                               kind: emissions}
  water_withdrawal:        {element: "TotalVolumeOfWaterWithdrawal",                       kind: volume}
  water_consumption:       {element: "TotalVolumeOfWaterConsumption",                      kind: volume}
  waste_generated:         {element: "TotalWasteGenerated",                                kind: mass}
  waste_recovered:         {element: "TotalWasteRecovered",                                kind: mass}

# XBRL unit measure -> our unit spelling (src/gauge/standardize/units.py).
# `null` means the label does NOT determine the unit and evidence is required (see rules below).
unit_labels:
  "Non-SI:TJ": "TJ"
  "Non-SI:GJ": "GJ"
  "Non-SI:MJ": "MJ"
  "Non-SI:tCO2e": "tCO2e"
  "Non-SI:ktCO2e": "ktCO2e"
  "Non-SI:MtCO2e": null           # tonnes for UltraTech (88,884,246), million tonnes for Tata Steel (64)
  "in-capmkt-types:kl": "kL"
  "Non-SI:t": "t"
  "iso4217:INR": null             # rupees, crore, million or thousand depending on the filer

# Rules for the two ambiguous labels (the loader applies them; anything else needs an override):
ambiguity:
  # MtCO2e: zero is unambiguous; >= 1000 cannot be million tonnes (no company emits 1000 Mt), so it is
  # tonnes; below 1000 could be million tonnes (a steel maker) or tonnes (a small emitter): override.
  emissions_label_tonnes_min: 1000
  emissions_tonnes_unit: "tCO2e"
  # INR: below this, revenue is almost certainly not in rupees (the primary five all exceed INR 9e10).
  # Between this and `revenue_max_inr` it is read as rupees. Anything else needs an override.
  revenue_min_inr: 10000000000        # INR 1,000 crore
  revenue_max_inr: 100000000000000    # INR 10 lakh crore
  revenue_unit: "INR"
  # Year-over-year ratio beyond these bounds between the two years of one filing is flagged.
  yoy_scale_break_ratio: 100

# Section A fields that help to decide a revenue scale (reported in the same filing, scale varies).
revenue_anchors:
  - "TotalRevenueOfTheCompany"
  - "Turnover"

# Assurance sub-type element per environmental group (values seen: Reasonable). `assured` on the report
# is true when every group below carries Reasonable or Limited assurance.
assurance_groups:
  energy: "AssuranceSubTypeForDetailsOfTotalEnergyConsumptionInJoulesOrMultiplesAndEnergyIntensity"
  ghg: "AssuranceSubTypeForDetailsOfGreenHouseGasEmissionsAndItsIntensity"
  water: "AssuranceSubTypeForDetailsOfTheDisclosuresRelatedToWaterWithdrawal"
  waste: "AssuranceSubTypeForDetailsRelatedToWasteManagementByTheEntity"
assurance_accepted: ["Reasonable", "Limited"]

# The filing reports its own per-rupee intensities. Checking absolute / (intensity x stated revenue)
# catches a numerator whose unit differs from the absolute value. It cannot detect a scaled revenue,
# because filers scale the denominator the same way (see docs/DATA_SOURCES.md).
intensity_checks:
  energy: {intensity: "EnergyIntensityPerRupeeOfTurnover",                                  absolute: [energy_total]}
  ghg:    {intensity: "TotalScope1AndScope2EmissionsIntensityPerRupeeOfTurnover",            absolute: [scope1_emissions, scope2_emissions]}
  water:  {intensity: "WaterIntensityPerRupeeOfTurnover",                                    absolute: [water_consumption]}
  waste:  {intensity: "WasteIntensityPerRupeeOfTurnover",                                    absolute: [waste_generated]}
intensity_tolerance: 0.05
