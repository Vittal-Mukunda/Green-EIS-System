# Model panel (spec §4.7, hard rules 3, 4, 12).
#
# `name` must be the EXACT identifier shown by Cursor's model list on the day of the run, and must
# not change mid-study. Never "auto". A name that is a placeholder (starts with TODO), empty, or
# "auto" makes `gauge run` refuse to start (see gauge.config.assert_models_ready).
# Primary panel: 4 NON-Claude models, different vendors where possible. Claude is excluded from the
# primary panel to control self-preference (the prompts are built by Claude).

models:
  # ---- primary panel: Cursor channel ----------------------------------------------------------
  - {key: P1, role: primary, channel: cursor, vendor: "TODO(owner): e.g. OpenAI", name: "TODO_FILL_FROM_CURSOR_LIST"}
  - {key: P2, role: primary, channel: cursor, vendor: "TODO(owner): e.g. Google", name: "TODO_FILL_FROM_CURSOR_LIST"}
  - {key: P3, role: primary, channel: cursor, vendor: "TODO(owner): e.g. xAI",    name: "TODO_FILL_FROM_CURSOR_LIST"}
  - {key: P4, role: primary, channel: cursor, vendor: "TODO(owner): a fourth vendor", name: "TODO_FILL_FROM_CURSOR_LIST"}

  # ---- controlled baseline: one open-weight model, free API tier -------------------------------
  # OpenRouter IDs MUST end in ":free" (hard rule 12). CHECKED 2026-10-02 against
  # https://openrouter.ai/api/v1/models: the spec's default `openai/gpt-oss-120b` exists only as a
  # PAID model (no ":free" variant), so it cannot be used. `gauge run --mode api` re-checks the ID
  # against the live list before every start. Proposal (owner may change; see docs/VERIFY.md V-04):
  #   nvidia/nemotron-3-super-120b-a12b:free  open-weight 120B, 262k context, supports seed/top_p
  #   google/gemma-4-31b-it:free              open-weight 31B, 262k context, supports seed/top_p
  # If the same family is also in your Cursor list, prefer it (spec 4.7) and say so in the paper.
  - key: B1
    role: baseline
    channel: api
    provider: openrouter
    vendor: "NVIDIA (open-weight)"
    name: "nvidia/nemotron-3-super-120b-a12b:free"

  # ---- optional: Claude sensitivity check (4 runs, reported separately, never pooled) ----------
  - {key: S1, role: sensitivity, channel: cursor, vendor: "Anthropic", name: "TODO_FILL_FROM_CURSOR_LIST", enabled: false}

# Parameters for API-channel runs. The Cursor channel exposes none of these (documented limitation).
api:
  temperature: 0
  top_p: null            # null = do not send; log only what was actually sent
  # Reasoning models count their reasoning tokens inside max_tokens; the JSON for 20 companies is
  # about 4,000 tokens, so leave generous room. TODO(verify) on the smoke test: finish_reason.
  max_tokens: 16000
  seed: 42               # supported by the proposed baseline (supported_parameters lists "seed")
  split_batch_by_sector: false   # NOT implemented: a 20-company prompt is ~12k tokens, far below the 262k context
  timeout_seconds: 300
  max_retries: 6         # on HTTP 429 / 5xx, with exponential backoff (Retry-After is honoured)
  fallback:              # used only if OpenRouter free tier is unusable
    provider: groq
    name: "TODO_FILL_AFTER_VERIFYING_GROQ_FREE_MODEL_LIST"

# How the Cursor CLI is called. Flags are those documented at https://cursor.com/docs/cli
# (read 2026-10-02): -p/--print, --output-format, --mode {plan|ask}, --model, --workspace,
# --list-models, -v/--version. `docs/RUNNER.md` lists what is verified and what is not.
cursor:
  executables: ["agent", "cursor-agent"]   # the docs call it `agent`; the spec says `cursor-agent`
  mode: ask               # documented as read-only: "explore ... without making changes"
  output_format: text
  prompt_transport: argv  # argv | stdin. stdin is NOT documented; `gauge smoke` can test it.
  timeout_seconds: 900
  argv_limit_chars: 30000       # a real C2 prompt is ~35,000 characters: argv will be refused
  shim_argv_limit_chars: 7500   # if `agent` is a .cmd/.bat shim, cmd.exe caps the line near 8,191
  extra_args: []
