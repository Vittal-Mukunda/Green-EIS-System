# Mock panel for dry runs: same shape as config/models.yaml (4 primary + 1 baseline) so run counts
# match the real study (20). Every channel is "mock": no Cursor call, no HTTP call, ever.
# `error_rate` is the mock's probability of deviating from the (synthetic) rule class; it exists only
# so the downstream evaluation code has something imperfect to score.

models:
  - {key: P1, role: primary,  channel: mock, vendor: "mock-vendor-a", name: "mock-model-a", error_rate: 0.05}
  - {key: P2, role: primary,  channel: mock, vendor: "mock-vendor-b", name: "mock-model-b", error_rate: 0.15}
  - {key: P3, role: primary,  channel: mock, vendor: "mock-vendor-c", name: "mock-model-c", error_rate: 0.25}
  - {key: P4, role: primary,  channel: mock, vendor: "mock-vendor-d", name: "mock-model-d", error_rate: 0.10}
  - {key: B1, role: baseline, channel: mock, vendor: "mock-open",     name: "mock-open-model:free", error_rate: 0.20}

api:
  temperature: 0
  top_p: null
  max_tokens: 8192
  seed: null
  split_batch_by_sector: false
