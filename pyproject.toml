[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greeneis"
version = "0.1.0"
description = "GreenEIS: emissions, data-trust scoring, hotspots and what-if analysis for small Indian manufacturing units"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "plotly>=5.18",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greeneis = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 110  # the formatter keeps code at 100; this only gives comments and docstrings slack

[tool.ruff.lint.per-file-ignores]
"dashboard/components/*.py" = ["E501"]  # HTML templates
"dashboard/*.py" = ["E501"]  # sentences of interface text
"tests/test_study_asi.py" = ["E501"]  # fixed-width record literals
"tests/test_ui_components.py" = ["E402"]  # dashboard/ goes on sys.path before the component imports
